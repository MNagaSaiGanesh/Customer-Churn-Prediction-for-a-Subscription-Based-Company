<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Churn Prediction</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .card {
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="text-center mb-4">
            <h1 class="fw-bold">Customer Churn Prediction</h1>
        </div>
        <div class="card">
            <form method="POST" class="mt-3">
                <div class="row">
                    <div class="col-md-4">
                        <h5 class="mb-3">Personal Details</h5>
                        <label class="form-label">Gender</label>
                        <select name="gender" class="form-select mb-3">
                            <option>Male</option><option>Female</option>
                        </select>
                        <label class="form-label">Senior Citizen</label>
                        <select name="SeniorCitizen" class="form-select mb-3">
                            <option value="0">No</option><option value="1">Yes</option>
                        </select>
                        <label class="form-label">Partner</label>
                        <select name="Partner" class="form-select mb-3">
                            <option>Yes</option><option>No</option>
                        </select>
                        <label class="form-label">Dependents</label>
                        <select name="Dependents" class="form-select mb-3">
                            <option>Yes</option><option>No</option>
                        </select>
                        <label class="form-label">Tenure</label>
                        <input type="number" name="tenure" class="form-control mb-3" required>
                    </div>
                    <div class="col-md-4">
                        <h5 class="mb-3">Services</h5>
                        <label class="form-label">Phone Service</label>
                        <select name="PhoneService" class="form-select mb-3">
                            <option>Yes</option><option>No</option>
                        </select>
                        <label class="form-label">Internet Service</label>
                        <select name="InternetService" class="form-select mb-3">
                            <option>DSL</option><option>Fiber optic</option><option>No</option>
                        </select>
                        <label class="form-label">Online Security</label>
                        <select name="OnlineSecurity" class="form-select mb-3">
                            <option>Yes</option><option>No</option><option>No internet service</option>
                        </select>
                        <label class="form-label">Tech Support</label>
                        <select name="TechSupport" class="form-select mb-3">
                            <option>Yes</option><option>No</option><option>No internet service</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <h5 class="mb-3">Billing & Payment</h5>
                        <label class="form-label">Contract</label>
                        <select name="Contract" class="form-select mb-3">
                            <option>Month-to-month</option><option>One year</option><option>Two year</option>
                        </select>
                        <label class="form-label">Payment Method</label>
                        <select name="PaymentMethod" class="form-select mb-3">
                            <option>Electronic check</option><option>Mailed check</option>
                            <option>Bank transfer (automatic)</option><option>Credit card (automatic)</option>
                        </select>
                        <label class="form-label">Monthly Charges</label>
                        <input type="number" step="0.01" name="MonthlyCharges" class="form-control mb-3" required>
                        <label class="form-label">Total Charges</label>
                        <input type="number" step="0.01" name="TotalCharges" class="form-control mb-3" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary w-100 mt-3">Predict</button>
            </form>
        </div>
        {% if prediction %}
        <div class="alert alert-info mt-4 text-center">
            <h4>Prediction: {{ prediction }}</h4>
            <p>Probability: {{ probability | round(2) }}</p>
        </div>
        {% endif %}
    </div>
</body>
</html>
